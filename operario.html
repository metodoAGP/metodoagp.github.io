<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fichajes del operario · métodoAGP</title>
<meta name="theme-color" content="#14181f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fichajes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#e6e4df;--card:#fbfaf8;--ink:#17191d;--mute:#6b6e75;--line:#d8d5ce;--dark:#14181f;--dark2:#222833;--red:#e5532d;--green:#2f8f4e;--greenS:#e1f1e6;--amber:#d98a1f;--amberS:#fbefd9;--blue:#1f4fa3;
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);min-height:100vh;min-height:100dvh;padding-bottom:max(24px,env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.top{background:var(--dark);color:#fff;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top img{width:38px;height:38px;border-radius:50%;background:#fff}
.top h1{font:700 22px/1 var(--disp);letter-spacing:.02em;margin:0;text-transform:uppercase}
.top small{display:block;color:#a9b0bd;font-size:12px;margin-top:2px}
.top .sw{margin-left:auto;background:var(--dark2);border:0;color:#d5dae3;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600}
main{padding:16px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));max-width:560px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font:700 13px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.mute{color:var(--mute)}
/* identificación */
.pick{display:grid;gap:10px}
.who{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:64px}
.av{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 17px var(--disp);flex:none}
.who b{display:block;font-size:17px}.who span{font-size:12px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
/* reloj */
.clock{background:var(--dark);color:#fff;border-radius:20px;padding:18px 16px;text-align:center}
.clock .t{font:700 64px/1 var(--disp);letter-spacing:.01em}
.clock .t i{font:700 26px var(--disp);color:#9aa3b2;font-style:normal;margin-left:3px}
.clock .d{color:#b8bfcb;font-size:14px;margin-top:4px}
.me{display:flex;align-items:center;gap:12px}
.me .av{width:50px;height:50px;font-size:19px}
.me b{font-size:20px;display:block;line-height:1.15}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.pill.in{background:var(--greenS);color:var(--green)}.pill.out{background:var(--amberS);color:var(--amber)}.pill.no{background:#ececec;color:var(--mute)}
.big{width:100%;min-height:84px;border:0;border-radius:18px;font:700 30px var(--disp);letter-spacing:.03em;text-transform:uppercase;color:#fff}
.big.in{background:var(--green)}.big.out{background:var(--red)}
.big:active{transform:scale(.98);filter:brightness(.93)}
.big[disabled]{opacity:.5}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:#f0eee9;border-radius:12px;padding:10px 12px}
.kv b{display:block;font:700 24px var(--disp)}.kv span{font-size:12px;color:var(--mute)}
/* orden de trabajo */
#otov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.otc{max-width:560px;margin:0 auto}.otb{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.otp{font:700 30px var(--disp);letter-spacing:.04em}
.otr{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.otr.sub{padding-left:14px;color:var(--mute)}
/* coche en curso */
.cur{background:var(--greenS);border:1px solid var(--green);border-radius:16px;padding:14px}
.cur .pl{font:700 28px var(--disp);letter-spacing:.04em}
.cur .tm{font:700 34px var(--disp);color:var(--green);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;min-height:52px;padding:0 18px;font-weight:700;font-size:16px;background:var(--dark);color:#fff}
.btn.go{background:var(--green)}.btn.stop{background:var(--red);width:100%;min-height:58px;font-size:18px}
.btn.sm{min-height:46px;padding:0 16px}
.btn.cam{background:#fff;color:var(--ink);border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.row2 .btn.stop{width:auto}
.acts{display:flex;gap:8px;align-items:center}
.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;margin-bottom:10px}
.cars{display:grid;gap:8px}
.car{display:flex;align-items:center;gap:10px;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.car .pl{font:700 20px var(--disp);letter-spacing:.05em;background:#fff;border:2px solid #222;border-radius:5px;padding:1px 8px;display:inline-block}
.car small{display:block;color:var(--mute);margin-top:3px;font-size:12.5px}
.last{display:grid;gap:0}
.last div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.last div:last-child{border:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.dot.in{background:var(--green)}.dot.out{background:var(--amber)}
.warn{background:var(--amberS);border:1px solid #ecd2a2;border-radius:12px;padding:12px 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--dark);color:#fff;border-radius:999px;padding:12px 20px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* PIN */
.pin{display:grid;gap:12px;justify-items:center;text-align:center}
.pin .dots{display:flex;gap:12px;height:20px}
.pin .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}.pin .dots i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:64px;border-radius:16px;border:1px solid var(--line);background:#fff;font:700 26px var(--disp)}
.pad button:active{background:#ececec}
.err{color:#c0321b;font-weight:600;min-height:22px}
.inst{font-size:13.5px;color:var(--mute)}
a{color:var(--blue)}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:13px;padding:10px}
</style>
</head>
<body>
<header class="top">
  <img src="icon-192.png" alt="">
  <div><h1>Mis fichajes</h1><small>métodoAGP · tiempo comprado y tiempo invertido</small></div>
</header>
<main id="app"></main>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="nube.js"></script>
<script>
(function(){
"use strict";
var STN={rec:"Recepcionado",val:"Valoración",esp:"En espera chapa",des:"Desmontaje",cha:"Chapa",pp:"Preparación pintura",cab:"Cabina",mon:"Montaje",mrp:"Mecánica rápida",min:"Mecánica incidental",ctl:"Control y lavado",apr:"Valoración",pie:"En espera chapa",pch:"Desmontaje",pin:"Preparación pintura"};
function isPin(k){return k==="pp"||k==="cab"||k==="pin"}
var $=function(s){return document.querySelector(s)};
function p2(n){return (n<10?"0":"")+n}
function hm(ts){var d=new Date(ts);return p2(d.getHours())+":"+p2(d.getMinutes())}
function fdur(ms){var m=Math.max(0,Math.round(ms/60000));return Math.floor(m/60)+" h "+p2(m%60)+" min"}
function fclock(ms){var s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/3600)+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function ini(n){return String(n||"?").split(/\s+/).slice(0,2).map(function(x){return x[0]}).join("").toUpperCase()}
function chk(r){if(r&&r.error)throw r.error;return r}

/* ── estado (todo viene de la nube y es solo del propio operario) ── */
var C=null,me=null,marks=[],jobs=[],cars=[],phc={},filter="",codeErr="",phase="load",bootErr="",busy=false,photoFor=null,unlinkSure=false;
var toastT;function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove("on")},2800)}
function buzz(){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
function sod(){var d=new Date();d.setHours(0,0,0,0);return d.toISOString()}

function status(){
  var inside=false,since=null,tot=0;
  marks.forEach(function(m){if(m.t==="in"){if(!inside){inside=true;since=m.ts}}else if(inside){tot+=m.ts-since;inside=false;since=null}});
  if(inside)tot+=Date.now()-since;
  return {inside:inside,since:since,ms:tot,out:marks.length&&!inside?marks[marks.length-1].ts:null};
}
function openJob(){for(var i=jobs.length-1;i>=0;i--)if(!jobs[i].e)return jobs[i];return null}
function investedMs(){var t=0;jobs.forEach(function(j){t+=(j.e||Date.now())-j.s});return t}
function carOf(id){for(var i=0;i<cars.length;i++)if(cars[i].id===id)return cars[i];return null}
function myCars(){
  if(!me)return [];
  return cars.filter(function(c){if(!STN[c.fase])return false;var q=me.seccion;if(q==="pintura")return isPin(c.fase);if(q==="mecanica_rapida")return c.fase==="mrp";if(q==="mecanica_incidental"||q==="mecanica")return c.fase==="min";return !isPin(c.fase)&&c.fase!=="mrp"&&c.fase!=="min"})
    .sort(function(a,b){return String(a.fecha_salida||"").localeCompare(String(b.fecha_salida||""))});
}

/* ── carga de datos ── */
async function loadAll(){
  var r=chk(await C.from("operarios").select("id,taller_id,nombre,seccion").maybeSingle());
  me=r.data;if(!me)return false;
  var s0=sod();
  var m=chk(await C.from("marcas").select("id,ts,tipo").gte("ts",s0).order("ts")).data||[];
  marks=m.map(function(x){return {id:x.id,ts:Date.parse(x.ts),t:x.tipo}});
  var j=chk(await C.from("trabajos").select("id,tarjeta_id,or_num,matricula,fase,seccion,inicio,fin").gte("inicio",s0).order("inicio")).data||[];
  jobs=j.map(function(x){return {id:x.id,card:x.tarjeta_id,or:x.or_num,pl:x.matricula,st:x.fase,s:Date.parse(x.inicio),e:x.fin?Date.parse(x.fin):null}});
  if(status().inside||true){
    var rc=await C.from("tarjetas_operario").select("id,or_num,matricula,vehiculo,fase,fecha_salida,ot").order("fecha_salida");
    if(rc.error)rc=await C.from("tarjetas_operario").select("id,or_num,matricula,vehiculo,fase,fecha_salida").order("fecha_salida");
    cars=chk(rc).data||[]}
  var wk=new Date(Date.now()-7*864e5).toISOString(),f=chk(await C.from("fotos").select("tarjeta_id").gte("creado",wk)).data||[];
  phc={};f.forEach(function(x){phc[x.tarjeta_id]=(phc[x.tarjeta_id]||0)+1});
  return true;
}
async function boot(){
  try{
    C=await NUBE.client("agp-sb-op");
    var tok=(new URLSearchParams(location.search).get("c")||"").trim();
    var ses=(await C.auth.getSession()).data.session;
    if(tok){await redeem(tok);try{history.replaceState(null,"",location.pathname)}catch(e){}}
    else if(!ses){phase="nolink";view();return}
    var ok=await loadAll();
    phase=ok?"ok":"nolink";if(!ok)codeErr="Este móvil ya no está vinculado. Abre tu enlace personal o pide uno nuevo al taller.";
  }catch(e){
    if(/enlace no v/i.test(e&&e.message||"")){phase="nolink";codeErr="Enlace no válido o caducado. Pide uno nuevo al taller."}
    else{phase="err";bootErr=NUBE.msg(e)}
  }
  view();
}
async function redeem(tok){
  var ses=(await C.auth.getSession()).data.session;
  if(!ses)chk(await C.auth.signInAnonymously());
  chk(await C.rpc("canjear_enlace",{p_enlace:tok}));
}
async function refresh(){if(phase!=="ok"||busy)return;try{await loadAll();view()}catch(e){}}

/* ── interfaz ── */
/* ── orden de trabajo (hoja de la reparación, sin importes) ── */
function fh1(n){return (Math.round((+n||0)*100)/100).toLocaleString("es-ES")+" h"}
function showOT(id){
  var c=carOf(id);if(!c||!c.ot)return;var o=c.ot,sp=o.sp||[15,70,15],t=(sp[0]+sp[1]+sp[2])||1,pp=o.pp==null?75:o.pp,prep=(o.hPint||0)*pp/100,mec=o.mec||[];
  function row(a,b,cl){return '<div class="otr'+(cl?' '+cl:'')+'"><span>'+a+'</span><b>'+b+'</b></div>'}
  var h='<div class="otc"><div class="otb"><div><div class="otp">'+esc(c.matricula||o.mat||"")+'</div><div class="mute">OR '+esc(c.or_num)+' · '+esc(c.vehiculo||o.car||"")+'</div></div><button class="btn" data-otx="1">Cerrar</button></div>'+
    '<div class="mute" style="font-size:13px;margin:4px 0 10px">Tasador: '+esc(o.tas||"—")+(c.fecha_salida?' · Acabado previsto: '+esc(String(c.fecha_salida).slice(0,10).split("-").reverse().join("/")):'')+'</div>'+
    '<h2>Chapista · '+fh1(o.hCh)+'</h2>'+row('Desmontaje',fh1(o.hCh*sp[0]/t))+row('Chapa',fh1(o.hCh*sp[1]/t))+row('Montaje',fh1(o.hCh*sp[2]/t))+
    '<div class="mute" style="margin-top:8px"><b>Recambios a cambiar:</b> '+((o.rec||[]).map(esc).join(", ")||"ninguno")+'</div>'+
    '<h2 style="margin-top:16px">Pintor · '+fh1(o.hPint)+'</h2>'+(o.pz||[]).map(function(z){return row(esc(z.n),fh1(z.h))}).join("")+row('Preparación',fh1(prep),'sub')+row('Cabina',fh1((o.hPint||0)-prep),'sub')+
    '<div class="mute" style="margin-top:8px"><b>Consumo sugerido (l listos al uso):</b> color base agua '+(o.hPint*0.06).toFixed(2).replace(".",",")+' · barniz '+(o.hPint*0.12).toFixed(2).replace(".",",")+' · fondo '+(o.hPint*0.04).toFixed(2).replace(".",",")+'</div>'+
    (mec.length?'<h2 style="margin-top:16px">Mecánica</h2>'+mec.map(function(m){return row(esc(m.t)+' <small class="mute">'+(m.k==="i"?"incidental":"rápida")+'</small>',fh1(m.h))}).join(""):'')+
    '<div class="row2" style="margin-top:16px"><button class="btn cam" data-photo="'+esc(c.id)+'">📷 Hacer foto</button><button class="btn" data-otx="1">Cerrar</button></div></div>';
  var old=$("#otov");if(old)old.remove();
  var d=document.createElement("div");d.id="otov";d.innerHTML=h;document.body.appendChild(d);
}
function view(){
  var app=$("#app");
  if(phase==="load"){app.innerHTML='<div class="card"><h2>Conectando…</h2><p class="mute" style="margin:0">Un momento.</p></div>';return}
  if(phase==="err"){app.innerHTML='<div class="card"><h2>Sin conexión</h2><p>'+esc(bootErr||"No se ha podido conectar con el taller.")+'</p><button class="btn go" data-retry="1" style="width:100%">Reintentar</button></div>';return}
  if(phase==="nolink"){
    app.innerHTML='<div class="card"><h2>Tu acceso personal</h2><p style="margin:0 0 12px">Abre el enlace personal que te ha enviado el taller, o escribe aquí tu código.</p><input class="search" id="code" type="text" autocapitalize="none" autocomplete="off" placeholder="Código personal" maxlength="40"><div class="err">'+esc(codeErr)+'</div><button class="btn go" data-code="1" style="width:100%">Entrar</button></div><p class="inst" style="text-align:center">Cada operario ve solo sus propios datos.</p>';return}
  var st=status(),oj=openJob(),now=new Date();
  var days=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"],mons=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  var h='<div class="clock"><div class="t" id="clk"></div><div class="d">'+days[now.getDay()]+' '+now.getDate()+' de '+mons[now.getMonth()]+'</div></div>';
  h+='<div class="card"><div class="me"><span class="av">'+esc(ini(me.nombre))+'</span><div><b>'+esc(me.nombre)+'</b><span class="pill '+(st.inside?'in':st.out?'out':'no')+'">'+(st.inside?'Dentro desde '+hm(st.since):st.out?'Fuera · saliste '+hm(st.out):'Sin fichar hoy')+'</span></div></div></div>';
  h+='<button class="big '+(st.inside?'out':'in')+'" data-mark="'+(st.inside?'out':'in')+'"'+(busy?' disabled':'')+'>'+(st.inside?'Fichar salida':'Fichar entrada')+'</button>';
  h+='<div class="kv"><div><b>'+fdur(st.ms)+'</b><span>presente hoy</span></div><div><b>'+fdur(investedMs())+'</b><span>en coches hoy</span></div></div>';
  var tracks=me.seccion!=="indirecto";
  if(tracks&&st.inside){
    if(oj){var oc=carOf(oj.card);h+='<div class="cur"><h2 style="color:var(--green)">Trabajando en</h2><div class="pl">'+esc(oj.pl||(oc&&oc.matricula)||oj.or)+'</div><div class="mute">'+esc(oc?oc.vehiculo||"":"")+' · '+esc(STN[oj.st]||oj.st)+'</div><div class="tm" id="jt"></div><div class="row2"><button class="btn cam" data-photo="'+esc(oj.card||"")+'">📷 Hacer foto</button>'+(oc&&oc.ot?'<button class="btn" data-ot="'+esc(oc.id)+'">📄 Orden</button>':'')+'<button class="btn stop" data-job="end"'+(busy?' disabled':'')+'>Acabo</button></div><div class="mute" style="font-size:13px;margin-top:8px">'+(phc[oj.card]||0)+' foto(s) en este coche (últimos 7 días)</div></div>'}
    var list=myCars(),q=filter.trim().toUpperCase();
    if(q)list=list.filter(function(c){return ((c.matricula||"")+" "+c.or_num+" "+(c.vehiculo||"")).toUpperCase().indexOf(q)>-1});
    h+='<div class="card"><h2>Coches de '+({pintura:"pintura",mecanica_rapida:"mecánica rápida",mecanica_incidental:"mecánica incidental",mecanica:"mecánica"}[me.seccion]||"chapa")+'</h2><input class="search" id="q" type="search" placeholder="Buscar matrícula u OR" value="'+esc(filter)+'" autocomplete="off">';
    if(!list.length)h+='<p class="mute" style="margin:6px 0">'+(q?'Ningún coche coincide.':'No hay coches en tu fase en el planificador.')+'</p>';
    else h+='<div class="cars">'+list.map(function(c){var on=oj&&oj.card===c.id;return '<div class="car"><div><span class="pl">'+esc(c.matricula)+'</span><small>'+esc(c.vehiculo||"")+' · '+esc(STN[c.fase])+'</small></div><div class="acts">'+(c.ot?'<button class="btn sm" data-ot="'+esc(c.id)+'" aria-label="Orden de trabajo">📄</button>':'')+'<button class="btn cam sm" data-photo="'+esc(c.id)+'" aria-label="Hacer foto">📷</button>'+(on?'<span class="pill in">En curso</span>':'<button class="btn go sm" data-job="start" data-card="'+esc(c.id)+'"'+(busy?' disabled':'')+'>Comienzo</button>')+'</div></div>'}).join("")+'</div>';
    h+='</div>';
  }else if(tracks){
    h+='<div class="warn">Ficha tu entrada para ver los coches y empezar a imputar tiempo.</div>';
  }else{
    h+='<div class="warn">Tu sección no imputa tiempo a los coches. Solo fichas entrada y salida.</div>';
  }
  if(marks.length)h+='<div class="card"><h2>Mis fichajes de hoy</h2><div class="last">'+marks.slice().reverse().map(function(m){return '<div><span><i class="dot '+m.t+'"></i>'+(m.t==="in"?"Entrada":"Salida")+'</span><b>'+hm(m.ts)+'</b></div>'}).join("")+'</div></div>';
  h+='<p class="inst" style="text-align:center">Herramienta de gestión del tiempo comprado; no sustituye al registro horario legal.</p>';
  h+='<p style="text-align:center;margin:0"><button class="lnk" data-unlink="1">'+(unlinkSure?"Pulsa otra vez para desvincular este móvil":"Desvincular este móvil")+'</button></p>';
  app.innerHTML=h;tick();
}
function tick(){
  var c=$("#clk");if(c){var d=new Date();c.innerHTML=p2(d.getHours())+":"+p2(d.getMinutes())+"<i>:"+p2(d.getSeconds())+"</i>"}
  var j=$("#jt");if(j&&phase==="ok"){var oj=openJob();if(oj)j.textContent=fclock(Date.now()-oj.s)}
}
setInterval(tick,1000);

/* ── fotos: se reducen y suben a la carpeta privada del taller ── */
function shrink(file,cb){
  var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){var M=1280,w=img.width,h=img.height,k=Math.min(1,M/Math.max(w,h)),c=document.createElement("canvas");
    c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    if(c.toBlob)c.toBlob(function(b){cb(b)},"image/jpeg",.72);else cb(null)};
  img.onerror=function(){URL.revokeObjectURL(url);cb(null)};img.src=url;
}
async function sendPhoto(card,blob){
  var path=me.taller_id+"/"+card+"/"+NUBE.uuid()+".jpg";
  chk(await C.storage.from("fotos").upload(path,blob,{contentType:"image/jpeg",upsert:false}));
  try{chk(await C.from("fotos").insert({taller_id:me.taller_id,tarjeta_id:card,operario_id:me.id,ruta:path}))}
  catch(e){try{await C.storage.from("fotos").remove([path])}catch(x){}throw e}
  phc[card]=(phc[card]||0)+1;
}
document.addEventListener("change",function(ev){
  if(ev.target.id!=="cam"||!photoFor)return;var f=ev.target.files&&ev.target.files[0],card=photoFor;photoFor=null;if(!f)return;
  toast("Subiendo foto…");
  shrink(f,function(b){if(!b){toast("No se ha podido leer la foto");return}
    sendPhoto(card,b).then(function(){buzz();toast("Foto añadida a la tarjeta del coche");view()}).catch(function(e){toast("No se ha subido la foto: "+NUBE.msg(e))})});
});

/* ── acciones ── */
async function act(fn,okMsg){
  if(busy)return;busy=true;view();
  try{await fn();await loadAll();buzz();if(okMsg)toast(okMsg)}
  catch(e){toast(NUBE.msg(e))}
  busy=false;view();
}
function doMark(t){
  var last=marks[marks.length-1];
  if(last&&Date.now()-last.ts<15000){toast("Ya has fichado hace unos segundos");return}
  act(async function(){
    if(t==="out"){var oj=openJob();if(oj)chk(await C.from("trabajos").update({fin:new Date().toISOString()}).eq("id",oj.id))}
    chk(await C.from("marcas").insert({taller_id:me.taller_id,operario_id:me.id,tipo:t}));
  },(t==="in"?"Entrada":"Salida")+" registrada · "+hm(Date.now()));
}
function doJob(kind,card){
  if(!status().inside){toast("Ficha primero tu entrada");return}
  if(kind==="end"){
    var oj=openJob();if(!oj)return;
    act(async function(){chk(await C.from("trabajos").update({fin:new Date().toISOString()}).eq("id",oj.id))},"Acabo · "+(oj.pl||oj.or));return}
  var cd=carOf(card);if(!cd){toast("Ese coche ya no está en el planificador");return}
  act(async function(){
    var o=openJob();if(o)chk(await C.from("trabajos").update({fin:new Date().toISOString()}).eq("id",o.id));
    chk(await C.from("trabajos").insert({taller_id:me.taller_id,operario_id:me.id,tarjeta_id:cd.id,or_num:cd.or_num,matricula:cd.matricula,fase:cd.fase,seccion:["pintura","mecanica_rapida","mecanica_incidental"].indexOf(me.seccion)>-1?me.seccion:me.seccion==="mecanica"?"mecanica_incidental":"chapa"}));
  },"Comienzo · "+(cd.matricula||cd.or_num));
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("button");if(!t)return;
  if(t.dataset.retry){phase="load";view();boot();return}
  if(t.dataset.code){var cv=($("#code")&&$("#code").value||"").trim();var mm=cv.match(/[?&]c=([A-Za-z0-9]+)/);if(mm)cv=mm[1];if(!cv){codeErr="Escribe tu código";view();return}
    phase="load";view();
    (async function(){try{await redeem(cv);var ok=await loadAll();phase=ok?"ok":"nolink";codeErr=ok?"":"Código no válido"}catch(e){phase="nolink";codeErr=/enlace no v/i.test(e&&e.message||"")?"Código no válido":NUBE.msg(e)}view()})();return}
  if(t.dataset.unlink){
    if(!unlinkSure){unlinkSure=true;view();setTimeout(function(){unlinkSure=false;if(phase==="ok")view()},5000);return}
    C.auth.signOut().then(function(){me=null;marks=[];jobs=[];cars=[];unlinkSure=false;phase="nolink";codeErr="";view()});return}
  if(t.dataset.photo){photoFor=t.dataset.photo;$("#cam").value="";$("#cam").click();return}
  if(t.dataset.ot){showOT(t.dataset.ot);return}
  if(t.dataset.otx){var ov=$("#otov");if(ov)ov.remove();return}
  if(t.dataset.mark){doMark(t.dataset.mark);return}
  if(t.dataset.job){doJob(t.dataset.job,t.dataset.card);return}
});
document.addEventListener("input",function(ev){if(ev.target.id==="q"){filter=ev.target.value;var pos=ev.target.selectionStart;view();var q=$("#q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}}});
document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh()});
setInterval(function(){if(!document.hidden)refresh()},60000);
window.addEventListener("online",refresh);
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
view();boot();
})();
</script>
