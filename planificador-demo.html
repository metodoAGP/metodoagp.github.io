<!doctype html><html><head><meta charset=utf8>
<script src="acceso.js"></script><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Planificador de taller · métodoAGP</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: banda oscura de cabecera, filtros, resumen de capacidad por sección y tablero kanban con scroll horizontal propio */
:root{
  --bg:#e6e4e1; --panel:#f3f2ef; --chip:#ffffff; --ink:#1f2124; --mute:#666a70; --line:#d2cfca;
  --bar:#2b2c2f; --bar-ink:#f2f1ee; --accent:#e5532d; --accent-ink:#ffffff;
  --ok:#3f9d3a; --warn:#e28a1c; --bad:#d6382d;
  --k-white:#fbfaf7; --k-red:#ee7767; --k-purple:#b98ec6; --k-green:#8fe04f; --k-blue:#5fb7dc; --k-orange:#f5a03a; --k-yellow:#f2d03f; --k-ink:#1b1c1e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141517; --panel:#202225; --chip:#2b2d31; --ink:#ecebe8; --mute:#9a9da2; --line:#34373b; --bar:#0d0e0f; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141517; --panel:#202225; --chip:#2b2d31; --ink:#ecebe8; --mute:#9a9da2; --line:#34373b; --bar:#0d0e0f; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.35}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* cabecera */
.top{background:var(--bar);color:var(--bar-ink)}
.top .wrap{padding-block:14px 0}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.brand h1{margin:0;font:800 28px/1 var(--display);letter-spacing:.01em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1 small{font:500 12px var(--body);letter-spacing:.12em;color:#a8aaae}
.brand h1{margin-right:auto}
.logo{flex:none;margin-right:20px;display:block;align-self:center}
.logo img{display:block;width:56px;height:56px}
@media (max-width:700px){.top .wrap{position:relative}.logo{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));margin:0}.logo img{width:38px;height:38px}.brand h1{padding-left:50px}}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.search{display:flex;background:#3a3b3f;border-radius:6px;overflow:hidden;min-width:0}
.search input{background:transparent;border:0;padding:8px 10px;width:210px;max-width:100%;min-width:0;color:var(--bar-ink)}
.search input::placeholder{color:#9b9da2}
.btn{background:#3a3b3f;border:0;border-radius:6px;padding:8px 12px;color:var(--bar-ink);font-weight:600}
.btn:hover{background:#4a4b50}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:#b5b7bb;padding:8px 12px 9px;font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tab span{font:600 11px var(--body);background:#45464b;border-radius:4px;padding:1px 5px;margin-left:5px;color:#d5d6d9}
.tab[aria-selected="true"]{color:#fff;border-color:var(--accent)}

/* filtros */
.filters{background:var(--panel);border-bottom:1px solid var(--line)}
.filters .wrap{display:flex;flex-wrap:wrap;gap:8px;padding-block:10px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:0 4px 0 9px;min-width:0}
.chip span{color:var(--mute);white-space:nowrap}
.chip select{background:transparent;border:0;padding:6px 4px;max-width:150px;min-width:0}
.chip select option{color:#1f2124;background:#fff}
.clear{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 4px}

/* resumen */
.sum{background:var(--panel);border-bottom:1px solid var(--line)}
.sum .wrap{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding-block:10px}
.sum .stats{gap:6px 18px}
.sum .bars{flex:1 1 520px}
.big{font:800 42px/0.9 var(--display)}
.big small{display:block;font:500 11px var(--body);letter-spacing:.12em;color:var(--mute);margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px}
.stat{font-variant-numeric:tabular-nums}
.stat b{display:block;font:700 11px var(--body);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.stat span{font:700 18px var(--display);letter-spacing:.02em}
.ops{display:flex;flex-wrap:wrap;gap:6px 10px}
.ops label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mute)}
.ops input{width:64px;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(var(--nb,5),minmax(0,1fr));gap:6px 14px;flex:1 1 100%;min-width:0}
.bar b{display:flex;justify-content:space-between;gap:6px;font:600 11.5px var(--body);white-space:nowrap}
.bar b span{overflow:hidden;text-overflow:ellipsis}
.bar b em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.track{height:5px;border-radius:3px;background:var(--line);margin:3px 0 2px;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.track i.mid{background:var(--warn)}.track i.low{background:var(--bad)}
.bar small{color:var(--mute);font-size:10.5px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* tablero */
/* barra de desplazamiento horizontal también arriba, fija al bajar por la página */
.topsc{overflow-x:auto;overflow-y:hidden;position:sticky;top:0;z-index:5;background:var(--bg);margin-top:8px;padding-top:2px}
.topsc div{height:1px}
.board{display:flex;gap:12px;overflow-x:auto;padding-block:14px 22px;align-items:flex-start;scroll-snap-type:x proximity}
.col{flex:0 0 232px;scroll-snap-align:start;min-width:0}
.col.over .stack{outline:2px dashed var(--accent);outline-offset:3px;border-radius:8px}
.col h2{margin:0;display:flex;justify-content:space-between;align-items:baseline;font:800 17px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;gap:6px}
.col h2 em{font:600 12px var(--body);font-style:normal;color:var(--mute)}
.col .tot{font-size:10.5px;color:var(--mute);margin:3px 0 8px;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:10px;min-height:60px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:14px 10px;color:var(--mute);text-align:center;font-size:12px}

.card{position:relative;border-radius:8px;padding:9px 10px 8px;color:var(--k-ink);box-shadow:0 1px 0 rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.1);cursor:grab;display:flex;flex-direction:column;gap:3px}
.card:active{cursor:grabbing}
.card.drag{opacity:.45}
.t-white{background:var(--k-white)}.t-red{background:var(--k-red)}.t-purple{background:var(--k-purple)}
.t-green{background:var(--k-green)}.t-blue{background:var(--k-blue)}.t-orange{background:var(--k-orange)}.t-yellow{background:var(--k-yellow)}
/* Color de tarjeta = estado operativo (4 colores) */
.s-run{background:#c9ebcb;border-left:5px solid #2f8f4e}
.s-rdy{background:#cfe3f6;border-left:5px solid #2c6fb3}
.s-blk{background:#fbe2a8;border-left:5px solid #d18a00}
.s-que{background:#e4e3e0;border-left:5px solid #8d9096}
.dl{font:700 10px var(--body);border-radius:3px;padding:2px 6px;background:rgba(0,0,0,.08);color:var(--k-ink);white-space:nowrap}
.dl.r{background:#c92f26;color:#fff}
.r1{display:flex;align-items:center;gap:6px}
.or{font:700 17px/1 var(--display);letter-spacing:.01em;flex:1}
.cm{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:18px;border-radius:9px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.25);font:600 10.5px var(--body)}
.cm.has{background:#e5532d;color:#fff;border-color:#e5532d}
.ct{font:600 10.5px var(--body);background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.2);border-radius:4px;padding:1px 5px}
.r2{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.pri{font:700 9.5px var(--body);letter-spacing:.06em;border-radius:3px;padding:2px 6px;color:#fff;margin-right:auto}
.p-MEDIO{background:#e8872b}.p-FUERTE{background:#cf3a2e}.p-NORMAL{background:#6c6f75}.p-RÁPIDO{background:#2f6fd0}
.plate{display:inline-flex;align-items:center;background:#fff;border:1.5px solid #222;border-radius:4px;font:700 12.5px/1 var(--display);letter-spacing:.04em;padding:2px 6px 2px 0;overflow:hidden}
.plate i{display:block;width:8px;align-self:stretch;background:#1c46b5;margin-right:5px;margin-block:-2px}
.car{font-size:11.5px;opacity:.9}
.ins{font-size:11.5px;font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--mute);padding:8px 0 2px}.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.25);vertical-align:-3px;margin-right:5px}.leg b{color:var(--ink);font-weight:600}
.dlg label.chk{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;font-size:14px;color:var(--ink);padding:4px 0}.dlg .chk input{width:18px;height:18px;padding:0;flex:none}
.vs{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}.vs span{font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;background:rgba(255,255,255,.55);color:#222;border:1px solid rgba(0,0,0,.18)}.vs span.w{background:#fff3cd;border-color:#c99a00}.vs span.n{background:rgba(255,255,255,.35);color:#555;border-color:rgba(0,0,0,.12)}.vs span.g{background:#d1f0d8;border-color:#1f8a3b}.vs span.r{background:#f8d7da;border-color:#b02a37}
.dlg.aj{width:min(820px,100%);font-size:14px;padding:22px 26px}.dlg.aj h3{font-size:24px;margin-bottom:10px}
.dlg.aj .gst{padding:12px 14px;margin:10px 0}.dlg.aj .gst h4{font-size:14px;font-weight:700;margin:0 0 8px}
.dlg.aj .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px}
.dlg.aj .hh{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.dlg.aj .hr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;align-items:end;margin:6px 0}
.dlg.aj .hr span{grid-column:1/-1;font-size:13px;color:var(--ink)}
.dlg.aj label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.dlg.aj label.chk{flex-direction:row;font-size:14px;color:var(--ink)}
.dlg.aj input:disabled{opacity:.4}
@media (max-width:640px){.dlg.aj .g4{grid-template-columns:1fr 1fr}.dlg.aj .hr{grid-template-columns:1fr 1fr}.dlg.aj .hr span{grid-column:1/-1;padding-bottom:0}}
/* entrega */
.eg{padding-block:14px 30px;display:flex;flex-direction:column;gap:18px}
.eg h2{margin:0;font:800 20px var(--display);text-transform:uppercase;letter-spacing:.02em}
.egw{background:var(--chip);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.egh{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.egh h3{margin:0;font:800 17px var(--display);text-transform:uppercase}
.egh span{color:var(--mute);font-size:12.5px}
.egh .pk{display:inline-flex;gap:6px;margin-left:auto}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font:700 11px var(--body);white-space:nowrap}
.pill.o{background:color-mix(in srgb,var(--ok) 25%,var(--chip));color:var(--ink)}.pill.w{background:color-mix(in srgb,var(--warn) 40%,var(--chip));color:var(--ink)}.pill.b{background:var(--bad);color:#fff}.pill.g{background:var(--line);color:var(--ink)}
.egr{display:grid;grid-template-columns:78px minmax(150px,1.1fr) minmax(170px,1.1fr) 92px 100px 120px minmax(200px,2fr);gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);border-left:5px solid transparent;cursor:pointer;font-size:13px}
.egr:first-of-type{border-top:0}
.egr:hover{background:color-mix(in srgb,var(--ink) 5%,var(--chip))}
.egr.o{border-left-color:var(--ok)}.egr.w{border-left-color:var(--warn)}.egr.b{border-left-color:var(--bad)}.egr.g{border-left-color:var(--line)}
.egr small{display:block;color:var(--mute);font-size:11.5px}
.egr .dd{font:800 17px var(--display);line-height:1.1}
.egr .dd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;border:1px solid rgba(0,0,0,.25)}
.egr .why{font-size:12.5px;line-height:1.35}
/* icono de información con explicación al pasar el ratón */
.inf.open{background:var(--ink)}
.egtl .tile:last-child .inf:hover::after,.egtl .tile:last-child .inf.open::after,.egtl .tile:last-child .inf:focus-visible::after{left:auto;right:-12px;transform:none}
.inf{display:inline-grid;place-items:center;width:14px;height:14px;border-radius:50%;background:var(--mute);color:#fff;font:700 10px/1 var(--body);margin-left:5px;cursor:help;position:relative;text-transform:none;letter-spacing:0;vertical-align:1px}
.inf:hover::after,.inf.open::after,.inf:focus-visible::after{content:attr(data-tip);position:absolute;top:20px;left:-12px;width:320px;background:var(--bar);color:#fff;font:400 12px/1.45 var(--body);padding:10px 12px;border-radius:7px;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:10;white-space:pre-line}
.egw{overflow:visible}
.egh2{padding:6px 14px;font:700 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.stp{display:flex;gap:2px;margin-top:3px}.stp i{flex:1;height:5px;border-radius:2px;background:var(--line)}
/* horas imputadas encima de cada tramo de fase */
.stp span{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.stp span i{flex:none;display:block}
.stp em{font:600 9px/1 var(--body);font-style:normal;color:var(--ink);text-align:center;height:9px;white-space:nowrap}.stp i.d{background:var(--ok)}.stp i.n{background:var(--warn)}
.egt{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;color:var(--mute);font-size:13px}.egt label{display:flex;gap:6px;align-items:center;color:var(--ink)}
@media (max-width:980px){.egh2{display:none}.egr{grid-template-columns:1fr 1fr;gap:6px 12px}.egr .why{grid-column:1/-1}}

.gst{border:1px solid var(--line,#ccc);border-radius:10px;padding:8px 10px;margin:8px 0}.gst h4{margin:0 0 6px;font-size:13px}.gst .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.gst label{display:flex;flex-direction:column;font-size:11.5px;gap:2px}.gst select{font:inherit;font-size:13px}@media (max-width:520px){.gst .g2{grid-template-columns:1fr}}
.ics{display:flex;gap:5px;margin-block:1px}
.ics svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.hrs{font:600 11.5px var(--body);font-variant-numeric:tabular-nums}
.hrs b{font-weight:700;margin-left:2px}
.phn{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;background:rgba(255,255,255,.85);color:#1b1c1e;border:1px solid rgba(0,0,0,.22);border-radius:999px;padding:1px 8px 1px 5px;font:700 10.5px var(--body)}
.phn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.pgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-bottom:10px}
.pth{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;aspect-ratio:1}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pbig{width:100%;max-height:60vh;object-fit:contain;border-radius:8px;background:#000}
.sec-h2{margin:14px 0 6px;font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.wk{display:flex;align-items:center;gap:5px;align-self:flex-start;max-width:100%;background:#1f2a22;color:#fff;border-radius:999px;padding:2px 9px 2px 5px;font:700 10.5px var(--body)}
.wk svg{width:14px;height:14px;flex:none;fill:none;stroke:#7ee2a0;stroke-width:2;stroke-linecap:round}
.wk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk::after{content:'';width:7px;height:7px;border-radius:50%;background:#3ddc84;flex:none;box-shadow:0 0 0 0 rgba(61,220,132,.7);animation:wkp 1.8s infinite}
@keyframes wkp{70%{box-shadow:0 0 0 6px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
@media (prefers-reduced-motion:reduce){.wk::after{animation:none}}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 6px;font-size:10px;opacity:.95}
.foot .who{flex:1 1 100%;opacity:.8}
.due{font:700 10px var(--body);border-radius:3px;padding:2px 6px;color:#fff}
.due.v{background:#c92f26}.due.h{background:#e8671c}.due.f{background:#fff7e0;color:#8a4b00;border:1px solid #e0a64a}.due.n{background:rgba(0,0,0,.15);color:var(--k-ink)}
.sal{font:600 10px var(--body);opacity:.85}

.msg{padding:60px 16px;text-align:center;color:var(--mute)}

/* diálogos */
.ov{position:fixed;inset:0;background:rgba(10,10,12,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--panel);color:var(--ink);border-radius:10px;width:min(580px,100%);max-height:100%;overflow:auto;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.dlg .t th,.dlg .t td{padding:5px 6px;white-space:normal;font-size:12px;letter-spacing:0}.dlg .t th{font-size:10px}.dlg .tag{margin-left:4px;display:inline-block}
.dlg.bd{width:min(1100px,100%);font-size:15px;padding:24px 28px}.dlg.bd h3{font-size:30px;margin-bottom:16px}
.dlg.bd .cdg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:6px 28px;align-items:start}
.dlg.bd .kv{font-size:15px}.dlg.bd .gst{padding:12px 14px}.dlg.bd .gst h4{font-size:15px}.dlg.bd .gst label{font-size:13px}.dlg.bd .gst select{font-size:15px;padding:8px}
.dlg.bd .t th,.dlg.bd .t td{font-size:14px;padding:8px 10px}.dlg.bd .t th{font-size:11px}.dlg.bd .sec-h2{font-size:13px}.dlg.bd .cap{font-size:13.5px}
@media (max-width:860px){.dlg.bd{padding:18px}.dlg.bd .cdg{grid-template-columns:minmax(0,1fr)}}
.dlg h3{margin:0 0 12px;font:800 22px var(--display);text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid label,.dlg label.f{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mute);min-width:0}
.grid .full{grid-column:1/-1}
.dlg input,.dlg select{background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:7px 8px;color:var(--ink);min-width:0}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.dlg .btn{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.dlg .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.dlg .btn.danger{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 12px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-variant-numeric:tabular-nums}

  /* ---------- Planificación ---------- */
  var hz=10;
  var THR={stk:30,rec:1,val:2,esp:3,des:2,cha:4,pp:3,ecb:1,cab:1,mon:1,mrp:1,min:3,ctl:1,lst:2};   // días máximos razonables en cada fase
  var CAPW={stk:20,rec:4,val:4,esp:4,des:4,cha:5,pp:4,ecb:2,cab:2,mon:3,mrp:4,min:4,ctl:3,lst:4};   // tope de vehículos por fase
  var REM={stk:[1,1,1],rec:[1,1,1],val:[1,1,1],esp:[1,1,1],des:[1,1,1],cha:[.5,1,1],pp:[0,1,.5],ecb:[0,.25,.5],cab:[0,.25,.5],mon:[0,0,.5],mrp:[0,0,1],min:[0,0,1],ctl:[0,0,0],lst:[0,0,0]}; // pendiente [chapa,pintura,mecánica]
  var THR_PER=3,THR_RG=4; // días de espera razonables de peritación y de recambio
  function delayOf(c){ // días de espera estimados antes de empezar: fase + procesos virtuales abiertos
    var d=c.st==='val'?1:0;
    if(PRE[c.st]){if(perOpen(c))d=Math.max(d,2);if(rgOpen(c))d=Math.max(d,3)}
    return d;
  }
  var SECN={c:'chapa',r:'mecánica rápida',i:'mecánica incidental',p:'pintura'};
  var DN=['do','lu','ma','mi','ju','vi','sá'];
  function pad(n){return n<10?'0'+n:''+n}
  function dm(d){return pad(d.getDate())+'/'+pad(d.getMonth()+1)}
  function r2(n){return (Math.round(n*100)/100).toFixed(2).replace('.',',')}
  function r1(n){return String(Math.round(n*10)/10).replace('.',',')}
  function avg(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
  function plural(n,s,p){return n+' '+(n===1?s:p)}
  function colName(k){k=lg(k);if(k==='ent')return 'Entregado';for(var i=0;i<COLS.length;i++){if(COLS[i][0]===k)return COLS[i][1]}return k}
  function dIn(c){return Math.max(0,Math.round((today-new Date((c.mv||iso(0))+'T00:00:00'))/864e5))}

  // horas necesarias cada día para cumplir la fecha de salida: se planifica hacia atrás (pintura al final, chapa justo antes)
  function loadMap(list,DAYS){
    var N=DAYS.length,L={c:[],r:[],i:[],p:[]},i;
    for(i=0;i<N;i++){L.c.push(0);L.r.push(0);L.i.push(0);L.p.push(0)}
    function put(k,h,a,b){if(h<=0)return;if(a<0)a=0;if(b<a)b=a;var n=b-a+1;for(var j=a;j<=b&&j<N;j++)L[k][j]+=h/n}
    var limc=2*st.hpd,limp=st.hpd;
    list.forEach(function(c){
      var r=REM[c.st]||[1,1,1],rc=hs(c,'c')*r[0],rp=hs(c,'p')*r[1],rr=hs(c,'r')*r[2],ri=hs(c,'i')*r[2],s0=delayOf(c);
      var cd=rc>0?Math.ceil(rc/limc-1e-9):0,pd=rp>0?Math.ceil(rp/limp-1e-9):0,tot=cd+pd;
      var sd=new Date(c.sal+'T00:00:00'),si=-1;
      DAYS.forEach(function(d,j){if(d<=sd)si=j});
      var e=Math.max(si,0),a=e-tot+1;
      if(a<s0){a=s0;e=a+tot-1}
      var ce=a+cd-1;
      put('c',rc,a,ce);put('p',rp,ce+1,e);
      ['r','i'].forEach(function(k){var h=k==='r'?rr:ri;if(tot>0)put(k,h,a,e);else put(k,h,Math.min(s0,e),Math.max(e,s0))});
    });
    return L;
  }

  function phaseStats(list){
    return COLSV().map(function(k){
      var g=list.filter(function(c){return c.st===k[0]}),days=g.map(dIn),s=sums(g);
      var over=days.filter(function(d){return d>THR[k[0]]}).length,a=avg(days);
      return {k:k[0],name:k[1],n:g.length,h:s.t,avg:a,over:over,thr:THR[k[0]],cap:CAPW[k[0]],score:g.length?g.length/CAPW[k[0]]+a/THR[k[0]]:0};
    });
  }

  function waitsBy(list,pred,keyf,daysf){
    var m={};
    list.filter(pred).forEach(function(c){var k=keyf(c)||'Sin proveedor';(m[k]=m[k]||[]).push(c)});
    return Object.keys(m).map(function(k){
      var g=m[k],d=g.map(daysf),s=sums(g);
      return {name:k,n:g.length,avg:avg(d),max:Math.max.apply(null,d),h:s.t,eur:s.eur};
    }).sort(function(a,b){return b.avg-a.avg});
  }

  // plan con capacidad real: por orden de fecha de salida, máx. 2 chapistas y 1 pintor por vehículo
  function schedule(list,DAYS){
    var N=DAYS.length,cap={c:(st.ops.c||0)*st.hpd,r:(st.ops.r||0)*st.hpd,i:(st.ops.i||0)*st.hpd,p:(st.ops.p||0)*st.hpd},used={c:[],r:[],i:[],p:[]},i;
    for(i=0;i<N;i++){used.c.push(0);used.r.push(0);used.i.push(0);used.p.push(0)}
    var lim={c:2*st.hpd,p:st.hpd,r:st.hpd,i:st.hpd};
    function alloc(k,h,from){
      if(h<=0)return from-1;
      var j=Math.max(from,0),end=from-1;
      while(h>1e-9&&j<N){var g=Math.min(h,lim[k],cap[k]-used[k][j]);if(g>1e-9){used[k][j]+=g;h-=g;end=j}j++}
      return h>1e-9?N:end;
    }
    function need(h,l){return h>0?Math.ceil(h/l-1e-9):0}
    return list.slice().sort(function(a,b){return a.sal<b.sal?-1:a.sal>b.sal?1:0}).map(function(c){
      var r=REM[c.st]||[1,1,1],rc=hs(c,'c')*r[0],rp=hs(c,'p')*r[1],rr=hs(c,'r')*r[2],ri=hs(c,'i')*r[2],rm=rr+ri,s0=delayOf(c);
      var ec=alloc('c',rc,s0),ep=alloc('p',rp,ec+1),er=alloc('r',rr,s0),ei=alloc('i',ri,s0);
      var fin=Math.max(ec,ep,er,ei,s0);
      var ic=s0+need(rc,lim.c)-1,ip=ic+need(rp,lim.p),ir=s0+need(rr,lim.r)-1,ii=s0+need(ri,lim.i)-1;
      var idealFin=Math.max(ic,ip,ir,ii,s0);
      var sd=new Date(c.sal+'T00:00:00'),si=-1;
      DAYS.forEach(function(d,j){if(d<=sd)si=j});
      var late=(rc+rp+rm>0&&fin>si)?fin-si:0,cause='';
      if(late>0){
        if(idealFin>si){cause=PRE[c.st]&&perOpen(c)?'Compromiso de pago pendiente':PRE[c.st]&&rgOpen(c)?'Falta de recambio':'Plazo corto para las horas'}
        else{
          var q={c:rc>0?ec-ic:0,p:rp>0?ep-(ec+need(rp,lim.p)):0,r:rr>0?er-ir:0,i:ri>0?ei-ii:0},k='c';
          ['p','r','i'].forEach(function(x){if(q[x]>q[k])k=x});
          var ends={c:ec,p:ep,r:er,i:ei};
          cause=(ends[k]>=N&&cap[k]<=0)?'Sin operarios de '+SECN[k]:'Cola en '+SECN[k];
        }
      }
      return {c:c,fin:fin,si:si,late:late,cause:cause};
    });
  }

  function heatCell(h,cap){
    if(cap<=0)return h>0.05?'<td class="hz h-b">sin cap.<small>'+fh(h)+'</small></td>':'<td class="hz h-z">—</td>';
    var p=h/cap*100,cls=p<70?'h-l':p<100?'h-o':p<115?'h-w':'h-b';
    return '<td class="hz '+cls+'">'+Math.round(p)+'%<small>'+fh(h)+'</small></td>';
  }

  function renderPlan(){
    var list=st.cards.filter(function(c){return live(c)&&visible(c)}),DAYS=wdays(40),n=hz,i;

  document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('.card');if(!c)return;dragId=c.dataset.id;c.classList.add('drag');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(x){}});
  document.addEventListener('dragend',function(e){dragId=null;document.querySelectorAll('.drag,.over').forEach(function(n){n.classList.remove('drag','over')})});
  document.addEventListener('dragover',function(e){var col=e.target.closest&&e.target.closest('.col');if(col&&dragId){e.preventDefault();document.querySelectorAll('.over').forEach(function(n){if(n!==col)n.classList.remove('over')});col.classList.add('over')}});
  document.addEventListener('drop',function(e){
    var col=e.target.closest&&e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();
    var c=st.cards.filter(function(x){return x.id===dragId})[0];
    if(c&&c.st!==col.dataset.col){var wv2=moveTo(c,col.dataset.col);save();if(wv2.length)setTimeout(function(){toast('Aviso: '+wv2.join(' · '))},60)}
    dragId=null;render();
  });

  // Entradas llevadas desde el tasador rápido (misma web, mismo navegador)
  (function(){
    var QK='agp-entrada-planificador',q=[];
    try{q=JSON.parse(localStorage.getItem(QK))||[]}catch(e){}
    if(!q.length)return;
    var n=0;
    q.forEach(function(x){
      var ex=st.cards.filter(function(c){return c.src===x.uid})[0];
      if(ex){if(x.cita){ex.cita=x.cita;ex.ent=x.cita.slice(0,10);if(x.tel)ex.tel=x.tel;if(x.email)ex.email=x.email;n++}return}
      var max=0;st.cards.forEach(function(c){var k=parseInt(c.id,10);if(k>max)max=k});
      st.cards.push({id:(max+1)+'-2026',pr:x.pr||'NORMAL',pl:(x.pl||'SIN MATRÍCULA').toUpperCase(),car:x.car||'Vehículo',col:'',ins:x.ins||'Particular',
        c:num(x.c),m:num(x.m),p:num(x.p),eur:num(x.eur),st:x.st||'rec',tc:'white',rec:1,as:1,ge:1,sal:x.sal||iso(7),ct:'0/0',cm:0,ic:['car'],ent:iso(0),mv:iso(0),prov:'',src:x.uid,origen:'Tasador rápido',cliente:x.cliente||'',obs:x.obs||'',tel:x.tel||'',email:x.email||'',cita:x.cita||''});
      norm(st.cards[st.cards.length-1]);
      if(x.cita)st.cards[st.cards.length-1].ent=x.cita.slice(0,10);
      n++;
    });
    try{localStorage.removeItem(QK)}catch(e){}
    if(n){save();window.__agpEntradas=n}
  })();

  function refreshWk(){var n=working(),p=photosAll(),ch=false;if(wkSig(n)!==wkSig(WK)){WK=n;ch=true}if(JSON.stringify(Object.keys(p).map(function(k){return [k,p[k].length]}))!==JSON.stringify(Object.keys(PH).map(function(k){return [k,PH[k].length]}))){PH=p;ch=true}if(ch&&$('#ov').hidden)render()}
  window.addEventListener('storage',function(e){if(e.key==='agp-fichajes-v1'||e.key===PHK)refreshWk()});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshWk()});
  setInterval(refreshWk,15000);
  render();
  if(window.NUBE){ /* base de datos compartida del taller */
    NUBE.bind('plan',{get:function(){return st},
      put:function(o){st=o;normSt();if(st&&st.cards)st.cards.forEach(norm);try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}if($('#ov').hidden)render()},
      persist:function(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}},
      refresh:function(){WK=working();PH=photosAll();if($('#ov').hidden)render()}});
    NUBE.start();
  }
  if(window.__agpEntradas){toast(window.__agpEntradas===1?'Reparación añadida desde el tasador':window.__agpEntradas+' reparaciones añadidas desde el tasador')}
})();
</script>

</body></html>
