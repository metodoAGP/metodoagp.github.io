<style>
:root{
  --bg:#f1eee6; --panel:#ffffff; --soft:#f7f4ec; --ink:#1f2124; --mute:#6a6d72; --line:#e3ded2; --bar:#1f2124; --bar-ink:#f2f1ee;
  --acc:#e5532d; --blue:#1f5f8b; --green:#2f8f5b; --amber:#d98a14; --red:#c93b2f;
  --blue-s:#dcebf5; --green-s:#dbeee3; --acc-s:#fbe3da; --amber-s:#faeccf; --red-s:#f6dcd8;
  --glass:#cfe3ef; --shadow:0 6px 22px rgba(40,34,20,.08);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141517; --panel:#202225; --soft:#2a2c30; --ink:#ecebe8; --mute:#9a9da2; --line:#363a3e; --bar:#0d0e0f;
  --blue:#6fb4e0; --green:#58c58a; --amber:#f0b04a; --red:#ef7a6e; --acc:#f0653b;
  --blue-s:#1e3342; --green-s:#1d3a2b; --acc-s:#43251c; --amber-s:#40331a; --red-s:#412220; --glass:#27404f; --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark;}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mb{text-transform:none;letter-spacing:0}
.top{background:var(--bar);color:var(--bar-ink)}
.top .wrap{padding-block:14px 0}
.brand{display:flex;align-items:center;gap:14px}
.logo{flex:none;display:block}.logo img{display:block;width:48px;height:48px}
.brand h1{margin:0;font:800 28px/1 var(--display);letter-spacing:.01em;text-transform:uppercase}
.brand h1 small{display:block;font:500 11px var(--body);letter-spacing:.14em;color:#a8aaae;margin-top:5px}
.brand .back{margin-left:auto;background:#3a3b3f;color:var(--bar-ink);text-decoration:none;border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:#b5b7bb;padding:10px 14px;font:700 17px var(--display);letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.tab[aria-selected="true"]{color:#fff;border-color:var(--acc)}
main{padding-block:22px 60px}
h2{margin:0;font:700 26px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.sec-h{margin:0 0 10px;font:700 18px var(--display);letter-spacing:.06em;text-transform:uppercase}
.sub{color:var(--mute);margin:4px 0 0;font-size:14px}
.mute{color:var(--mute)}.num{font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--red)}
.btn.az{color:#1f5f8b;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.az{color:#8cc4f0}}
:root[data-theme="dark"] .btn.az{color:#8cc4f0}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--mute)}
input[type=text],input[type=number],input[type=tel],input[type=email],input[type=date],input[type=datetime-local],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px;font-size:16px;min-width:0}
textarea{resize:vertical;min-height:70px}

.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* coche */
.carbox{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
svg.car{width:100%;height:auto;display:block;margin:0 auto}
.carscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.zone{fill:var(--panel);stroke:var(--mute);stroke-width:1.5;stroke-linejoin:round;cursor:pointer;transition:fill .15s,stroke .15s}
.zone:hover{fill:var(--acc-s);stroke:var(--acc)}
.zone.on{fill:var(--acc);stroke:var(--acc)}
.zone.on:hover{fill:var(--acc)}
.zone.wh{fill:var(--soft)}.zone.wh.on,.zone.on.thin{fill:var(--acc)}.zone.thin{stroke-width:1.2}
.zone:focus-visible{outline:none;stroke:var(--ink);stroke-width:3}
.zl{font:700 12px var(--body);fill:var(--mute);pointer-events:none;text-anchor:middle;letter-spacing:.06em}
.on-l{fill:#fff}
.glass{fill:none;stroke:var(--blue);stroke-width:1.2;opacity:.55;pointer-events:none}
.dec{fill:none;stroke:var(--mute);stroke-width:1.2;opacity:.7;pointer-events:none}
.dirl{font:700 11px var(--display);letter-spacing:.2em;fill:var(--mute);opacity:.7;pointer-events:none;text-anchor:start}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.sel{display:grid;gap:8px}
.sl{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.sl:first-child{border-top:0}
.pc{border-top:1px solid var(--line);padding:8px 0}.pc:first-child{border-top:0}
.pc1{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;font-size:14px}
.pc1 input{width:76px;padding:6px 8px;font-size:15px;text-align:right}
.pc1 .x{border:0;background:var(--soft);width:28px;height:28px;border-radius:50%}
.pc1 small{color:var(--mute);display:block;font-size:12px}
.dplate{display:inline-flex;align-items:stretch;height:19px;margin-left:8px;border:1.5px solid #1f2124;border-radius:4px;overflow:hidden;background:#fff;vertical-align:middle;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dplate .eu{width:15px;background:#0b3d91;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font:700 7px/1 var(--display)}
.dplate .eu i{width:7px;height:7px;border-radius:50%;border:1.5px dotted #ffd200;display:block}
.dplate .n{display:flex;align-items:center;padding:0 6px;font:700 13px/1 var(--display);letter-spacing:.08em;color:#111}
.dpl{display:flex;align-items:center}
.plate{display:flex;height:54px;max-width:280px;border:2.5px solid #1f2124;border-radius:9px;overflow:hidden;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.plate .eu{flex:0 0 38px;background:#0b3d91;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.plate .eu i{width:17px;height:17px;border-radius:50%;border:3px dotted #ffd200;display:block}
.plate .eu b{color:#fff;font:700 13px/1 var(--display)}
.plate input{flex:1;min-width:0;border:0!important;box-shadow:none!important;border-radius:0!important;background:#fff!important;color:#111!important;text-align:center;text-transform:uppercase;font:700 23px/1 var(--display)!important;letter-spacing:.06em;padding:0 4px!important;height:100%}
.plate input::placeholder{color:#c4c4c4;font-weight:600}
.plate:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.tag.no{background:rgba(229,83,45,.15);color:var(--acc)}
.nump{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--mute)}
.nump b{color:inherit;font:700 20px var(--display);letter-spacing:.04em}
.hfs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.hfs button{border:1.5px solid var(--line);background:var(--panel);color:inherit;border-radius:999px;padding:7px 14px;font:600 13px Inter,sans-serif;cursor:pointer}
.hfs button[aria-pressed="true"]{background:var(--ink,#1f2124);color:#fff;border-color:transparent}
.est{width:auto;padding:5px 10px;font-size:13px;height:38px}
input.est[type=datetime-local]{min-width:190px;text-align:center;font-family:inherit;color:inherit;border-radius:10px}
input.est[type=datetime-local]::-webkit-datetime-edit{padding:0}
input.est[type=datetime-local]::-webkit-date-and-time-value{text-align:center}
.mapctl{overflow:visible}
.mc{display:flex;flex-direction:column;gap:3px;width:100%;pointer-events:auto}
.mc select,.mc input{width:100%;font-size:12px;padding:2px 5px;border-radius:6px;border:1.5px solid #fff;background:#fff;color:#1f2124;height:23px;text-align:left;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mc input{text-align:right}
@media (max-width:760px){.mapctl{display:none}}
@media (min-width:761px){.pc2.mapped{display:none}}
.pc2{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pc2 select{width:auto;flex:1 1 170px;padding:7px 9px;font-size:15px}.pc2 input{width:110px;flex:0 0 110px;padding:7px 9px;font-size:15px;text-align:right}
.sl input{width:76px;padding:6px 8px;font-size:15px;text-align:right}
.sl .x{border:0;background:var(--soft);width:28px;height:28px;border-radius:50%}
.sl small{color:var(--mute);display:block;font-size:12px}

/* resumen */
.sum{position:sticky;top:12px;display:grid;gap:16px}
.tot{background:var(--ink);color:var(--bg);border-radius:18px;padding:20px}
.tot .t{font:700 54px/1 var(--display);font-variant-numeric:tabular-nums}
.tot small{opacity:.75}
.lines{display:grid;gap:0;margin-top:12px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid rgba(128,128,128,.3);font-size:14px}
.ln:first-child{border-top:0}
.ln b{font-variant-numeric:tabular-nums}
.mx{display:grid;gap:12px}
.mxr{display:grid;gap:5px}
.mxr .h{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.bar{position:relative;height:10px;border-radius:5px;background:var(--soft);overflow:visible}
.bar i{display:block;height:100%;border-radius:5px;background:var(--blue)}
.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--acc);text-decoration:none}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--soft)}
.tag.ok{background:var(--green-s);color:var(--green)}.tag.lo{background:var(--amber-s);color:var(--amber)}.tag.hi{background:var(--blue-s);color:var(--blue)}
.note{font-size:13px;color:var(--mute);line-height:1.5;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:2px solid var(--line);font-weight:600;white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tblw{overflow-x:auto}
.tbl input{width:84px;padding:6px 8px;font-size:15px;text-align:right}
.ov{position:fixed;inset:0;background:rgba(15,16,18,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.ov{align-items:center;padding:20px}}
.modal{background:var(--panel);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
@media (min-width:640px){.modal{border-radius:22px}}
.modal h3{margin:0 0 4px;font:700 26px/1.1 var(--display);text-transform:uppercase}
.modal .x{float:right;border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
.kpi b{display:block;font:700 30px/1.1 var(--display);margin-top:3px;font-variant-numeric:tabular-nums}

/* documento imprimible */
.doc{background:#fff;color:#1f2124;border:1px solid var(--line);border-radius:14px;padding:26px;margin-top:20px;font-size:14px}
.doc .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.doc .tn{font:800 30px/1 var(--display);text-transform:uppercase;color:#c8321d}
.doc .ttl{background:#e6e6e6;text-align:center;font:700 18px var(--display);letter-spacing:.08em;padding:7px;margin:12px 0 10px;text-transform:uppercase}
.doc .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;font-size:13.5px;padding:2px 0 4px}
.doc .sect{background:#f1f1f1;text-align:center;font:700 14px var(--display);letter-spacing:.1em;padding:5px;margin:14px 0 6px;text-transform:uppercase}
.doc .it{display:grid;grid-template-columns:minmax(0,1fr) 70px 70px 90px;gap:8px;padding:5px 2px;font-size:13.5px;border-bottom:1px solid #eee}
.doc .it b{text-align:right;font-variant-numeric:tabular-nums}
.doc .it span:nth-child(2),.doc .it span:nth-child(3){text-align:right}
.doc .totals{margin:14px 0 0 auto;max-width:300px;display:grid;gap:4px}
.doc .totals div{display:flex;justify-content:space-between;font-size:14px}
.doc .totals .g{font:700 20px var(--display);border-top:2px solid #1f2124;padding-top:6px;margin-top:4px;text-transform:uppercase}
.doc .txt{margin:12px 0;font-size:13.5px;line-height:1.5}
.doc svg.car{max-width:640px}
.doc .mute2{font-size:11.5px;color:#777}
.doc .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:18px;align-items:start}
.doc .pz{display:grid;grid-template-columns:minmax(0,1fr) 60px 60px;gap:8px;padding:3px 2px;font-size:13px;border-bottom:1px solid #eee}
.doc .pz span:nth-child(2),.doc .pz span:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}
.doc .pz.ph{font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#666}
.doc .pz.pt{font-weight:700;border-bottom:0;border-top:1.5px solid #1f2124}
.doc .it.sub{color:#666;font-size:12.5px}
.doc .obsl{margin-top:10px}
.doc .acc{margin-top:14px;break-inside:avoid}
.doc .accp{font-size:12.5px;line-height:1.45;margin:6px 0 0}
.doc .sig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:46px}
.doc .sig>div{display:flex;flex-direction:column;gap:3px;font-size:12px}
.doc .sig .line{border-bottom:1.5px solid #1f2124;height:1px}
.doc .rgpd{font-size:10px;color:#888;margin:14px 0 0}
.doc .obs{background:#f1f1f1;min-height:56px;padding:8px 10px;font-size:13px;white-space:pre-wrap;margin-top:6px}
.doc .zone{fill:#fff;stroke:#777}.doc .zone.on{fill:#e5532d;stroke:#e5532d}.doc .zone.wh{fill:#f3f3f3}.doc .zl{fill:#777}.doc .on-l{fill:#fff}.doc .dirl{fill:#888}
.doc .zone{cursor:default}.doc .zone:hover{fill:#fff;stroke:#777}.doc .zone.on:hover{fill:#e5532d;stroke:#e5532d}
@media (max-width:900px){.grid{grid-template-columns:1fr}.sum{position:static}}
@media (max-width:640px){
  svg.car{min-width:560px}.doc svg.car{min-width:0}
  main{padding-block:16px 50px}.brand h1{font-size:23px}.brand .back{padding:7px 10px;font-size:13px}.logo img{width:40px;height:40px}
  .tab{padding:10px 10px;font-size:15px}h2{font-size:23px}.tot .t{font-size:46px}
  .sl{grid-template-columns:minmax(0,1fr) auto auto}.sl .hp{display:none}
  .doc{padding:16px}.doc .two{grid-template-columns:1fr}.doc .sig{grid-template-columns:1fr;gap:34px}.doc .it{grid-template-columns:minmax(0,1fr) 60px 80px}.doc .it span:nth-child(2){display:none}
}
@media print{
  body{background:#fff}
  .top,.screen,.toast,.legal{display:none!important}
  #app>*:not(.doc){display:none!important}
  main{padding:0}.wrap{max-width:none;padding:0}
  html,body{width:auto;min-width:0;margin:0}
  .doc{border:0;margin:0;padding:12mm 13mm;box-sizing:border-box;width:100%;max-width:none;overflow:hidden;display:block!important;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc .tn{font-size:24px}.doc .ttl{margin:8px 0 6px;font-size:15px;padding:4px}.doc .meta,.doc .it,.doc .pz{font-size:11px}
  .doc .sect{margin:9px 0 4px;padding:3px;font-size:12px}
  .doc .two{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)!important;gap:12px}
  .doc svg.car{max-width:100%;max-height:62mm;width:100%;min-width:0!important}
  .doc .obs{min-height:30px;font-size:11px;padding:5px 8px}
  .doc .totals{margin-top:8px}.doc .totals .g{font-size:16px}
  .doc .sig{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:18px;margin-top:38px}
  .doc .accp{font-size:11px}
  @page{size:A4;margin:0}
}
</style>
</head>

<script>
"use strict";
/* ───────── Parámetros (editables en Ajustes) ───────── */
var KEY="agp-tasador-v1";
var PIECES=[
 {id:"capo",n:"Capó delantero",g:"b",h:2.5},{id:"add",n:"Aleta delantera dcha.",g:"b",h:1.5},{id:"adi",n:"Aleta delantera izq.",g:"b",h:1.5},
 {id:"pgd",n:"Paragolpes delantero",g:"b",h:1.5},{id:"pdd",n:"Puerta delantera dcha.",g:"b",h:1.8},{id:"pdi",n:"Puerta delantera izq.",g:"b",h:1.8},
 {id:"ptd",n:"Puerta trasera dcha.",g:"b",h:1.8},{id:"pti",n:"Puerta trasera izq.",g:"b",h:1.8},{id:"atd",n:"Aleta trasera dcha.",g:"b",h:2},

/* ───────── Cálculo ───────── */
function nivIdx(k){for(var i=0;i<NIV.length;i++)if(NIV[i][0]===k)return i;return 2}
function pieceH(i,coef){
  var cfg=C.cfg,s=B.sel[i]||{};
  if(cfg.baremo==="ces")return num(cfg.ces[i][nivIdx(s.niv||"med")]);
  if(cfg.baremo==="cz")return num(s.dm)*num(s.tipo==="lin"?cfg.czL:cfg.czA);
  return cfg.horas[i]*coef;
}
function pieceTag(i){
  var cfg=C.cfg,s=B.sel[i]||{};
  if(cfg.baremo==="ces")return NIV[nivIdx(s.niv||"med")][1];
  if(cfg.baremo==="cz")return s.dm?nf(num(s.dm),1)+(s.tipo==="lin"?" dm lineales":" dm² superficie"):"sin medir";
  return "";
}
function calc(){
  var cfg=C.cfg,ids=PIECES.filter(function(p){return B.sel[p.id]}).map(function(p){return p.id});
  var nb=ids.filter(function(i){return PID[i].g==="b"}).length, crit=nb>=13?"completo":nb>=3?"tres":nb===2?"dos":"suelta";
  var auto=cfg.coef[crit][B.size], coef=(B.coefMan!==""&&B.coefMan!=null)?Math.min(1,Math.max(0.3,num(B.coefMan))):auto;
  if(!ids.length){auto=1;coef=B.coefMan!==""?coef:1}
  if(cfg.baremo!=="rapido"){auto=1;coef=1}
  var hPint=0,hCh=0;
  ids.forEach(function(i){hPint+=pieceH(i,coef);hCh+=num(B.sel[i].ch)});
  var matQ=num(cfg.cal[B.cal||0]),moP=hPint*cfg.precioHora,mat=hPint*matQ,moC=hCh*cfg.precioHora,rec=0;
  B.recs.forEach(function(r){rec+=num(r.imp)});
  var bruto=moC+moP+mat+rec,dtoP=Math.min(100,num(B.dto)),dto=bruto*dtoP/100,bi=bruto-dto,iva=bi*cfg.iva/100;
  return {matQ:matQ,ids:ids,nb:nb,crit:crit,auto:auto,coef:coef,hPint:hPint,hCh:hCh,moP:moP,mat:mat,moC:moC,rec:rec,bruto:bruto,dtoP:dtoP,dto:dto,bi:bi,iva:iva,tot:bi+iva};
}

  else if(a==="addrec"){B.recs.push({d:"",imp:""});rerender()}
  else if(a==="new"){B={sel:{},size:B.size,coefMan:"",dto:0,recs:[],cliente:"",marca:"",modelo:"",mat:"",tasador:B.tasador,obs:"",savedId:"",sent:"",tel:"",email:"",cal:B.cal||0};rerender();toast("Presupuesto nuevo")}
  else if(a==="print"){if(r0().ids.length||r0().rec){var pv=saveCurrent();if(pv)refreshSum()}window.print()}
  else if(a==="save"){var sv=saveCurrent();if(!sv)return;refreshSum();toast("Presupuesto "+sv.num+" guardado")}
  else if(a==="wa"||a==="mail"){sendMsg(a)}
  else if(a==="toplan"){openPlan()}
  else if(a==="rech"){var rr=saveCurrent(null,"rech");if(!rr)return;B={sel:{},size:B.size,coefMan:"",dto:0,recs:[],cliente:"",marca:"",modelo:"",mat:"",tasador:B.tasador,obs:"",savedId:"",sent:"",tel:"",email:"",cal:B.cal||0};rerender();toast("Presupuesto "+rr.num+" marcado como rechazado")}
  else if(el.dataset.hf){hf=el.dataset.hf;render()}
  else if(a==="planok"){sendPlan()}
  else if(a==="planx"||a==="ovclose"&&ev.target===el){closeOv()}
  else if(a==="csv"){
    var L=["numero;estado;fecha;cliente;marca;modelo;matricula;tasador;horas_chapa;horas_pintura;mo_chapa;mo_pintura;material_pintura;recambios;base_imponible;total"];
    C.saved.forEach(function(x){L.push([x.num,(EST[x.estado||"pend"]||EST.pend)[0],x.fecha,x.cliente,x.marca,x.modelo,x.matricula||"",x.tasador,x.hCh,x.hPint,x.moC,x.moP,x.mat,x.rec,x.bi,x.tot].map(function(v){return typeof v==="number"?String(Math.round(v*100)/100).replace(".",","):String(v==null?"":v).replace(/;/g,",")}).join(";"))});
    var a2=document.createElement("a");a2.href=URL.createObjectURL(new Blob(["﻿"+L.join("\n")],{type:"text/csv"}));a2.download="presupuestos-metodoAGP.csv";document.body.appendChild(a2);a2.click();a2.remove()}
  else if(a==="reset"){if(!el.dataset.sure){el.dataset.sure="1";el.textContent="Pulsa otra vez para confirmar";return}C.cfg=JSON.parse(JSON.stringify(DEF));save();render();toast("Valores restaurados")}
});
document.addEventListener("keydown",function(ev){
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches&&ev.target.matches("svg .zone[data-p]")&&!ev.target.closest("#doc")){ev.preventDefault();toggle(ev.target.dataset.p);rerender();var z=$('svg.car .zone[data-p="'+ev.target.dataset.p+'"]');if(z)z.focus()}
});
document.addEventListener("input",function(ev){
  var e=ev.target;
  if(e.dataset.ch!==undefined&&B.sel[e.dataset.ch]){B.sel[e.dataset.ch].ch=e.value;refreshSum()}
  else if(e.dataset.rd!==undefined){B.recs[+e.dataset.rd].d=e.value;refreshSum()}
  else if(e.dataset.ri!==undefined){B.recs[+e.dataset.ri].imp=e.value;refreshSum()}
  else if(e.dataset.f==="mat"||e.id==="p-mat"){var ps=e.selectionStart;e.value=e.value.toUpperCase().replace(/[^A-Z0-9ÑÇ -]/g,"");try{e.setSelectionRange(ps,ps)}catch(x){}if(e.dataset.f==="mat"){B.mat=e.value;refreshSum()}}
  else if(e.dataset.est){var sx=C.saved.filter(function(x){return x.id===e.dataset.est})[0];if(sx){sx.estado=e.value;save();rerender()}}
  else if(e.dataset.f){var k=e.dataset.f;B[k]=k==="size"?+e.value:e.value;if(k==="size"){rerender()}else refreshSum()}
  else if(e.dataset.c){var k2=e.dataset.c;C.cfg[k2]=(k2==="taller"||k2==="tasadores")?e.value:num(e.value);save()}
  else if(e.dataset.niv){B.sel[e.dataset.niv].niv=e.value;rerender()}
  else if(e.dataset.tipo){B.sel[e.dataset.tipo].tipo=e.value;rerender()}
  else if(e.dataset.dm!==undefined){B.sel[e.dataset.dm].dm=e.value;var pcx=document.querySelector('.pc[data-id="'+e.dataset.dm+'"]'),sm=pcx&&pcx.querySelector("small");if(sm)sm.textContent="Pintura "+hh(pieceH(e.dataset.dm,1))+" · "+pieceTag(e.dataset.dm);document.querySelectorAll('[data-dm="'+e.dataset.dm+'"]').forEach(function(o){if(o!==e)o.value=e.value});refreshSum()}
  else if(e.dataset.calq){B.cal=+e.value;rerender()}
  else if(e.dataset.calp){C.cfg.cal[+e.dataset.calp]=num(e.value);save()}
  else if(e.dataset.bar){C.cfg.baremo=e.value;save();rerender()}
  else if(e.dataset.ces){var q=e.dataset.ces.split("|");C.cfg.ces[q[0]][+q[1]]=num(e.value);save()}
  else if(e.dataset.cza){C.cfg.czA=num(e.value);save()}
  else if(e.dataset.czl){C.cfg.czL=num(e.value);save()}
  else if(e.dataset.ch2){C.cfg.horas[e.dataset.ch2]=num(e.value);save()}
  else if(e.dataset.cf){var p=e.dataset.cf.split("|");C.cfg.coef[p[0]][+p[1]]=Math.min(1,Math.max(0.3,num(e.value)||1));save()}
});
document.addEventListener("change",function(ev){var e=ev.target;if(!e.dataset)return;
  if(e.dataset.f==="coefMan")rerender();
  else if(e.dataset.cita){var rc=C.saved.filter(function(x){return x.id===e.dataset.cita})[0];if(rc){citaDe(rc,e.value);rerender();toast(e.value?"Cita "+fmtCita(e.value)+" guardada y enviada al planificador":"Cita eliminada")}}});
render();
</script>
</body>
</html>
